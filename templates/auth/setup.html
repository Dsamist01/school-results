{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h3 class="mb-1 text-center"><i class="bi bi-stars"></i> Welcome!</h3>
        <p class="text-muted text-center">Let's create your administrator account to get started.</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Your Full Name</label>
            <input type="text" name="name" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 characters)</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Admin Account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
