{% extends "base.html" %}
{% block content %}
<h2 class="mb-1">Affective / Psychomotor Skills</h2>
<p class="text-muted">These are the skill ratings (1–5) that appear on each student's report card.</p>

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <form method="POST" class="d-flex gap-2">
      <input type="text" name="name" class="form-control" placeholder="e.g. Punctuality" required>
      <button class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add</button>
    </form>
  </div>
</div>

<div class="row row-cols-2 row-cols-md-4 g-2">
{% for s in skills %}
  <div class="col">
    <div class="card shadow-sm">
      <div class="card-body d-flex justify-content-between align-items-center py-2">
        <span>{{ s.name }}</span>
        <form method="POST" action="{{ url_for('admin.delete_skill', skill_id=s.id) }}">
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-x"></i></button>
        </form>
      </div>
    </div>
  </div>
{% endfor %}
</div>
{% endblock %}
